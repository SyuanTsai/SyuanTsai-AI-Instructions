            Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
            $pesterModules = @(Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq [version]'4.10.1' })
          }
          if ($pesterModules.Count -ne 1) { throw "Expected exactly one Pester 4.10.1 module; found $($pesterModules.Count)." }
          $manifestPath = Join-Path ([string]$pesterModules[0].ModuleBase) 'Pester.psd1'
          $manifestItem = Get-Item -Force -LiteralPath $manifestPath
          if ($manifestItem.PSIsContainer -or ($manifestItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Pester manifest must be a regular non-reparse file.' }
          $manifest = Import-PowerShellDataFile -LiteralPath $manifestPath -ErrorAction Stop
          if ([version]$manifest.ModuleVersion -ne [version]'4.10.1') { throw 'Installed Pester manifest is not version 4.10.1.' }

      - name: Run required Standard v1 authority gate
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRoot = [IO.Path]::GetFullPath((Get-Location).Path)
          $revision = (& git rev-parse --verify 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve the full checked-out HEAD revision.' }
          & ./scripts/Invoke-StandardAuthorityGate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -CandidateRoot $candidateRoot -AuthorityRoot $candidateRoot -CandidateRevision $revision -AuthorityRevision $revision -EventName $env:GITHUB_EVENT_NAME -ResultArtifact 'pr8-composition/authority-result.json'

      - name: Check whitespace
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff-tree --check --root -r HEAD
          fi
          exit 0

      - name: Run cross-platform composition and acquisition tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          if ($null -eq $pester) { throw 'Pester 4.10.1 is unavailable in test step.' }
          Import-Module $pester.Path -Force
          $testPaths = @(
            './tests/skills-source-composition.Tests.ps1',
            './tests/skills-source-acquisition.Tests.ps1'
          )
          foreach ($testPath in $testPaths) {
            $result = Invoke-Pester -Script $testPath -PassThru
            if ($null -eq $result) { throw "Pester did not return a result object for $testPath." }
            Write-Host "$testPath - Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount)"
            if ($result.TotalCount -isnot [int] -and $result.TotalCount -isnot [long]) { throw "Pester returned a non-integer TotalCount for $testPath." }
            if ([int64]$result.TotalCount -le 0) { throw "Pester discovered no tests in $testPath." }
            if ([int]$result.FailedCount -ne 0) { throw "Pester reported $($result.FailedCount) failed tests in $testPath." }
            if ([int]$result.PendingCount -ne 0) { throw "Pester reported $($result.PendingCount) pending tests in $testPath." }
            if ([int]$result.InconclusiveCount -ne 0) { throw "Pester reported $($result.InconclusiveCount) inconclusive tests in $testPath." }
            if ([int]$result.SkippedCount -ne 0) { throw "Pester reported $($result.SkippedCount) skipped tests in $testPath." }
            if ([int64]$result.PassedCount -ne [int64]$result.TotalCount) { throw "Pester result counts are incomplete for $testPath." }
          }

  routine-semantic-offline:
    name: Routine semantic offline fixture regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run all offline routine semantic fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B -c "import sys; print(sys.version); raise SystemExit(0 if sys.version_info >= (3, 10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Offline fixtures require Python 3.10 or newer.' }
          python -B -c "import unittest; suite=unittest.defaultTestLoader.discover('tests', pattern='test_routine_semantic_*.py'); unittest.TestCase().assertEqual(suite.countTestCases(), 61, 'Exact offline fixture count changed'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() and len(result.skipped) == 0 else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Offline routine semantic fixtures failed or skipped.' }
