name: PR8 PowerShell Validation

on:
  push:
    branches:
      - syp-79-multi-source-routing
  pull_request:
    branches:
      - syp-86
  workflow_dispatch:

jobs:
  windows-powershell-51:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pester 3.4.0
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Pester: $((Get-Module Pester).Version)"

      - name: Parse changed PowerShell files
        shell: powershell
        run: |
          $files = git diff --name-only origin/syp-86...HEAD -- '*.ps1' '*.psm1'
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$file parse errors: $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run full Pester suite
        shell: powershell
        run: |
          $result = Invoke-Pester -Script ./tests -PassThru
          Write-Host "Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }

  powershell-7:
    name: Pester (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pester 3.4.0
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Pester: $((Get-Module Pester).Version)"

      - name: Parse changed PowerShell files
        shell: pwsh
        run: |
          $files = git diff --name-only origin/syp-86...HEAD -- '*.ps1' '*.psm1'
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$file parse errors: $($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run full Pester suite
        shell: pwsh
        run: |
          $result = Invoke-Pester -Script ./tests -PassThru
          Write-Host "Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }
