          EVEN_B_RESULT: ${{ needs['windows-powershell-51-even-b'].result }}
          ODD_RESULT: ${{ needs['windows-powershell-51-odd'].result }}
          ODD_B_RESULT: ${{ needs['windows-powershell-51-odd-b'].result }}
