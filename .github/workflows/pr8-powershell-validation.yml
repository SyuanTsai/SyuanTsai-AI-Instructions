          & ./scripts/Invoke-PesterShardProcess.ps1 @executorArguments
          exit 0

  powershell-7-unix-composition:
    name: Composition (PowerShell 7 on Linux)
    needs: linux-callback-focused
    runs-on: ubuntu-latest
    steps:
