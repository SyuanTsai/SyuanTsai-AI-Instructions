          if ($env:EVEN_RESULT -cne 'success' -or $env:EVEN_B_RESULT -cne 'success' -or $env:ODD_RESULT -cne 'success' -or $env:ODD_B_RESULT -cne 'success') {
            throw "PowerShell 5.1 partition failure: even=$env:EVEN_RESULT even-b=$env:EVEN_B_RESULT odd=$env:ODD_RESULT odd-b=$env:ODD_B_RESULT"
