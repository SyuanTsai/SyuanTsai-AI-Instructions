          echo "namespace probe result: $probe_namespace"
          echo "private procfs mount ID: $probe_proc_mount_id"
          echo "namespace probe stderr: ${probe_stderr:-<empty>}"
          if [[ "$probe_exit" -ne 0 || -z "$probe_namespace" || ! "$probe_proc_mount_id" =~ ^[0-9]+$ ]]; then
            echo 'Linux PID namespace with private procfs is unavailable; refusing to start the composition suite.' >&2
            exit 1
          fi
          if [[ "$probe_namespace" == "$parent_namespace" ]]; then
            echo 'unshare did not create a distinct PID namespace.' >&2
            exit 1
          fi
          if [[ "$probe_proc_mount_id" == "$parent_proc_mount_id" ]]; then
            echo 'unshare did not create a private procfs mount.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goApplication = Get-Command -Name go -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $goCommandPath = if ($null -ne $goApplication.PSObject.Properties['Path']) { [string]$goApplication.Path } else { [string]$goApplication.Source }
          if ([string]::IsNullOrWhiteSpace($goCommandPath) -or -not [IO.Path]::IsPathRooted($goCommandPath)) { throw "setup-go returned a non-absolute Go path: $goCommandPath" }
          $versionOutput = @(& $goCommandPath version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STANDARD_GO_COMMAND_PATH=$goCommandPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run required Standard v1 authority gate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Invoke-StandardAuthorityGate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -GoCommandPath $env:STANDARD_GO_COMMAND_PATH

      - name: Check whitespace
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff-tree --check --root -r HEAD
          fi
          exit 0

      - name: Ensure Pester 4.10.1
        shell: pwsh
        run: |
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          if ($null -eq $pester) {
            Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
            $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          }
          if ($null -eq $pester) { throw 'Pester 4.10.1 is unavailable.' }

      - name: Run cross-platform composition and acquisition tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          if ($null -eq $pester) { throw 'Pester 4.10.1 is unavailable in test step.' }
          Import-Module $pester.Path -Force
          $testPaths = @(
            './tests/skills-source-composition.Tests.ps1',
            './tests/skills-source-acquisition.Tests.ps1'
          )
          $expectedTestCounts = @{
            './tests/skills-source-composition.Tests.ps1' = 8
            './tests/skills-source-acquisition.Tests.ps1' = 46
          }
          foreach ($testPath in $testPaths) {
            $result = Invoke-Pester -Script $testPath -PassThru
            if ($null -eq $result) { throw "Pester did not return a result object for $testPath." }
            Write-Host "$testPath - Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount)"
            if ($result.TotalCount -isnot [int] -and $result.TotalCount -isnot [long]) { throw "Pester returned a non-integer TotalCount for $testPath." }
            if ([int64]$result.TotalCount -ne [int64]$expectedTestCounts[$testPath]) { throw "Pester discovered $($result.TotalCount) tests in $testPath; expected exactly $($expectedTestCounts[$testPath])." }
            if ([int]$result.FailedCount -ne 0) { throw "Pester reported $($result.FailedCount) failed tests in $testPath." }
            if ([int]$result.PendingCount -ne 0) { throw "Pester reported $($result.PendingCount) pending tests in $testPath." }
            if ([int]$result.InconclusiveCount -ne 0) { throw "Pester reported $($result.InconclusiveCount) inconclusive tests in $testPath." }
            if ([int]$result.SkippedCount -ne 0) { throw "Pester reported $($result.SkippedCount) skipped tests in $testPath." }
            if ([int]$result.PassedCount -ne [int]$result.TotalCount) { throw "Pester result counts are incomplete for $testPath." }
          }
