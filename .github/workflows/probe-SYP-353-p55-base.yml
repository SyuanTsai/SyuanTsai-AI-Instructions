name: probe-SYP-353-p55-base
on:
  push:
    branches: [probe/SYP-353-p52-base]
permissions:
  contents: read
jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run every test file separately (Pester 4.10.1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "PowerShell $($PSVersionTable.PSVersion) on $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription) $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          $runner = Join-Path ([IO.Path]::GetTempPath()) 'probe-run-one.ps1'
          Set-Content -LiteralPath $runner -Encoding utf8 -Value @'
          param([string]$Path, [string]$Name)
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $r = Invoke-Pester -Script $Path -PassThru -Show None
          'FILE|{0}|passed={1}|failed={2}|skipped={3}|pending={4}|total={5}' -f $Name, $r.PassedCount, $r.FailedCount, $r.SkippedCount, $r.PendingCount, $r.TotalCount
          foreach ($t in @($r.TestResult | Where-Object { $_.Result -ne 'Passed' })) {
            $message = (([string]$t.FailureMessage) -replace '\r?\n', ' ') -replace '\|', '/'
            if ($message.Length -gt 400) { $message = $message.Substring(0, 400) }
            'NONPASS|{0}|{1}|{2}|{3}' -f $Name, $t.Result, $t.Name, $message
          }
          '@
          foreach ($file in Get-ChildItem ./tests -Filter '*.Tests.ps1' | Sort-Object Name) {
            $started = Get-Date
            $out = pwsh -NoProfile -File $runner -Path $file.FullName -Name $file.Name 2>&1
            $out | Where-Object { "$_" -match '^(FILE|NONPASS)\|' }
            if (-not ($out | Where-Object { "$_" -match '^FILE\|' })) { "FILE|$($file.Name)|crashed|seconds=$([int]((Get-Date) - $started).TotalSeconds)" }
          }
