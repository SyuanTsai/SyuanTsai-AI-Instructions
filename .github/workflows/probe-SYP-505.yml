# Temporary SYP-505 probe. Never merged.
name: probe-SYP-505
on:
  push:
    branches: ['probe/SYP-505-**']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.p.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: p
        shell: pwsh
        run: |
          $f = @(Get-ChildItem tests -Filter '*.Tests.ps1' | Sort-Object Name | ForEach-Object Name)
          "files=$(ConvertTo-Json -Compress -InputObject $f)" >> $env:GITHUB_OUTPUT
  pester:
    needs: plan
    name: ${{ matrix.os }} / ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        file: ${{ fromJSON(needs.plan.outputs.files) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pester 4.10.1
        shell: pwsh
        env:
          PROBE_FILE: ${{ matrix.file }}
        run: |
          $ErrorActionPreference = 'Continue'
          git config --global user.name probe
          git config --global user.email probe@example.test
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Get-Module Pester | Remove-Module -Force
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $r = Invoke-Pester -Script @("./tests/$env:PROBE_FILE") -PassThru
          foreach ($t in @($r.TestResult | Where-Object { $_.Result -ne 'Passed' })) {
            "FULLFAIL ===== $($t.Name) [$($t.Result)]"
            [string]$t.FailureMessage
            [string]$t.StackTrace
          }
          "PROBE_SUMMARY $env:PROBE_FILE passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount) pending=$($r.PendingCount) total=$($r.TotalCount)"
          if ($r.FailedCount -gt 0 -or $r.TotalCount -eq 0) { exit 1 }
          exit 0
