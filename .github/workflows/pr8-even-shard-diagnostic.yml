name: Draft even shard diagnostic

# Manual diagnostic only. This workflow is not a required source check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr8-even-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  even-diagnostic:
    name: Diagnostic ${{ matrix.runtime }} index ${{ matrix.index }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: ps51
            pester: 3.4.0
            index: 0
            total: 161
          - runtime: ps51
            pester: 3.4.0
            index: 4
            total: 18
          - runtime: ps7
            pester: 4.10.1
            index: 0
            total: 161
          - runtime: ps7
            pester: 4.10.1
            index: 4
            total: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Pester inventory and diagnostic partition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reviewed 33-file inventory including the routine semantic suite.
          $expectedInventorySha256 = 'c36a7ee43ac510303ec4f656fa61f43ab1e279aa609d134c873d48577904cb74'
          [string[]]$tracked = @(git ls-tree -r --name-only HEAD -- tests |
            Where-Object { $_ -cmatch '^tests/[^/]+\.Tests\.ps1$' })
          if ($LASTEXITCODE -ne 0) { throw 'Git test inventory lookup failed.' }
          [Array]::Sort($tracked, [StringComparer]::Ordinal)
          [string[]]$present = @(Get-ChildItem -LiteralPath tests -Filter '*.Tests.ps1' -File |
            ForEach-Object { 'tests/' + $_.Name })
          [Array]::Sort($present, [StringComparer]::Ordinal)
          if ($tracked.Count -ne 33 -or $present.Count -ne 33 -or
              ($tracked -join "`n") -cne ($present -join "`n")) {
            throw 'Tracked and checked-out Pester file inventories differ.'
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $bytes = (New-Object Text.UTF8Encoding($false)).GetBytes(($tracked -join "`n"))
            $actualSha = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          }
          finally { $sha.Dispose() }
          if ($actualSha -cne $expectedInventorySha256) { throw 'Pester inventory changed from reviewed candidate.' }
          [string[]]$isolated = @('tests/standard-validation-runner.Tests.ps1', 'tests/syp101-production-smoke-contract.Tests.ps1')
          [string[]]$ordered = @($isolated) + @($tracked | Where-Object { $isolated -cnotcontains $_ })
          if ($ordered.Count -ne 33 -or @($ordered | Select-Object -Unique).Count -ne 33) {
            throw 'Pester shard ordering lost or duplicated a test file.'
          }
          $index = [int]'${{ matrix.index }}'
          [string[]]$selected = @(for ($i = $index; $i -lt $ordered.Count; $i += 8) { $ordered[$i] })
          $expected = if ($index -eq 0) {
            [string[]]@(
              'tests/standard-validation-runner.Tests.ps1',
              'tests/bootstrap-ai-instructions.Tests.ps1',
              'tests/safe-zip.Tests.ps1',
              'tests/skills-source-retrieval.Tests.ps1',
              'tests/update-ai-instructions.Tests.ps1'
            )
          }
          elseif ($index -eq 4) {
            [string[]]@(
              'tests/ai-instructions-contract.Tests.ps1',
              'tests/license-delivery.Tests.ps1',
              'tests/skills-catalog-source-host.Tests.ps1',
              'tests/standard-semantic-inventory-probe.Tests.ps1'
            )
          }
          else { throw 'Unreviewed diagnostic partition index.' }
          if ($selected.Count -ne $expected.Count -or ($selected -join "`n") -cne ($expected -join "`n")) {
            throw 'Diagnostic partition differs from reviewed exact shard assignment.'
          }
          $counts = @{
            'tests/standard-validation-runner.Tests.ps1' = 51
            'tests/bootstrap-ai-instructions.Tests.ps1' = 75
            'tests/safe-zip.Tests.ps1' = 3
            'tests/skills-source-retrieval.Tests.ps1' = 5
            'tests/update-ai-instructions.Tests.ps1' = 27
            'tests/ai-instructions-contract.Tests.ps1' = 6
            'tests/license-delivery.Tests.ps1' = 9
            'tests/skills-catalog-source-host.Tests.ps1' = 1
            'tests/standard-semantic-inventory-probe.Tests.ps1' = 2
          }
          $total = 0
          foreach ($file in $selected) { $total += [int]$counts[$file] }
          if ($total -ne [int]'${{ matrix.total }}') { throw 'Diagnostic expected test count changed.' }
          $skipped = if ($index -eq 4 -or '${{ matrix.runtime }}' -eq 'ps51') { 1 } else { 0 }
          Write-Host "DIAGNOSTIC_PLAN runtime=${{ matrix.runtime }} index=$index/8 files=$($selected.Count) total=$total skipped=$skipped inventory=$actualSha"

      - name: Run bounded diagnostic shards on Windows PowerShell 5.1
        if: matrix.runtime == 'ps51'
        shell: powershell
        run: |
          & ./scripts/Invoke-PesterEvenDiagnostic.ps1 -Runtime '${{ matrix.runtime }}' -PesterVersion '${{ matrix.pester }}' -PartitionIndex '${{ matrix.index }}' -ExpectedTotalCount '${{ matrix.total }}'

      - name: Run bounded diagnostic shards on PowerShell 7
        if: matrix.runtime == 'ps7'
        shell: pwsh
        run: |
          & ./scripts/Invoke-PesterEvenDiagnostic.ps1 -Runtime '${{ matrix.runtime }}' -PesterVersion '${{ matrix.pester }}' -PartitionIndex '${{ matrix.index }}' -ExpectedTotalCount '${{ matrix.total }}'

      - name: Retain bounded shard evidence on normal completion or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: even-diagnostic-${{ matrix.runtime }}-${{ matrix.index }}
          path: ${{ runner.temp }}/pester-shard-*.json
          if-no-files-found: warn
          retention-days: 7
