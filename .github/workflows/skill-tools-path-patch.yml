name: Skill-tools path patch probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: skill-tools-path-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  leg:
    name: Skill-tools path patch (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: authority-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.21.0' }
      - name: Run path patch probe leg
        shell: pwsh
        env:
          PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'authority-source'
          $work = Join-Path $env:RUNNER_TEMP "skill-tools-path-patch-$($env:PROBE_PLATFORM)"
          & (Join-Path $root 'tests/Invoke-SkillToolsPathPatchProbe.ps1') -Mode leg -Platform $env:PROBE_PLATFORM -RepositoryRoot $root -WorkRoot $work
          if (-not $?) { throw 'Skill-tools path patch probe leg failed.' }
      - name: Upload path patch probe result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skill-tools-path-patch-${{ matrix.platform }}
          path: ${{ runner.temp }}/skill-tools-path-patch-${{ matrix.platform }}/skill-tools-path-patch-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Skill-tools path patch aggregate
    timeout-minutes: 10
    needs: leg
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: authority-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: skill-tools-path-patch-*
          path: ${{ runner.temp }}/skill-tools-path-patch-legs
          merge-multiple: true
      - name: Aggregate path patch probe results
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'authority-source'
          & (Join-Path $root 'tests/Invoke-SkillToolsPathPatchProbe.ps1') -Mode aggregate -RepositoryRoot $root -LegResultsRoot (Join-Path $env:RUNNER_TEMP 'skill-tools-path-patch-legs')
          if (-not $?) { throw 'Skill-tools path patch probe aggregate failed.' }
