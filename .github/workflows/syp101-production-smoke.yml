name: SYP101 Production Smoke

on:
  push:
    branches:
      - syp-101
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke-windows-powershell:
    name: Production smoke (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run real pinned-archive production smoke
        shell: powershell
        run: |
          ./scripts/test-syp101-production-smoke.ps1

  production-smoke-powershell-7:
    name: Production smoke (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run real pinned-archive production smoke
        shell: pwsh
        run: |
          ./scripts/test-syp101-production-smoke.ps1
