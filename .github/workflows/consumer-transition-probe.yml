name: Consumer transition probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: consumer-transition-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  leg:
    name: Consumer transition probe (${{ matrix.platform }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-latest, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: authority-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, check-latest: true }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', check-latest: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.21.0' }
      - name: Run real transition leg
        shell: pwsh
        env:
          STANDARD_VALIDATION_GITHUB_API_TOKEN: ${{ github.token }}
          PROBE_PLATFORM: ${{ matrix.platform }}
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'authority-source'
          $work = Join-Path $env:RUNNER_TEMP "consumer-transition-probe-$($env:PROBE_PLATFORM)"
          & (Join-Path $root 'tests/Invoke-ConsumerTransitionProbe.ps1') -Mode leg -RepositoryRoot $root -WorkRoot $work `
            -Platform $env:PROBE_PLATFORM -WorkflowRunId $env:PROBE_RUN_ID -WorkflowRunAttempt $env:PROBE_RUN_ATTEMPT
      - name: Upload transition probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-transition-probe-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/consumer-transition-probe-${{ matrix.platform }}/gate/source-tools/diagnostics
            ${{ runner.temp }}/consumer-transition-probe-${{ matrix.platform }}/gate/validation-artifacts
            ${{ runner.temp }}/consumer-transition-probe-${{ matrix.platform }}/gate/receipts
          if-no-files-found: warn

  aggregate:
    name: Consumer transition probe aggregate
    timeout-minutes: 10
    needs: leg
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful transition legs
        shell: pwsh
        env:
          LEG_RESULT: ${{ needs.leg.result }}
        run: |
          if ($env:LEG_RESULT -cne 'success') {
            [Console]::Error.WriteLine("Transition probe leg job result was '$($env:LEG_RESULT)'; expected 'success'.")
            exit 1
          }
      - name: Configure Git checkout line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: authority-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: consumer-transition-probe-*
          path: ${{ runner.temp }}/consumer-transition-probe-legs
          merge-multiple: true
      - name: Aggregate transition receipts
        shell: pwsh
        env:
          PROBE_RUN_ID: ${{ github.run_id }}
          PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'authority-source'
          $work = Join-Path $env:RUNNER_TEMP 'consumer-transition-probe-aggregate'
          & (Join-Path $root 'tests/Invoke-ConsumerTransitionProbe.ps1') -Mode aggregate -RepositoryRoot $root -WorkRoot $work `
            -Platform aggregate -WorkflowRunId $env:PROBE_RUN_ID -WorkflowRunAttempt $env:PROBE_RUN_ATTEMPT `
            -LegReceiptsRoot (Join-Path $env:RUNNER_TEMP 'consumer-transition-probe-legs')
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-transition-probe-aggregate
          path: |
            ${{ runner.temp }}/consumer-transition-probe-aggregate/gate/aggregate-receipt.json
            ${{ runner.temp }}/consumer-transition-probe-aggregate/gate/receipts
          if-no-files-found: warn
