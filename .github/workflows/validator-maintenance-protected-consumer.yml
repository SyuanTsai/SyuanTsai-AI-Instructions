name: Validator Maintenance Protected Consumer

on:
  workflow_run:
    workflows: [Validator Maintenance Producer]
    types: [completed]

permissions:
  actions: read
  pull-requests: read
  contents: read

jobs:
  diagnostic-consumer:
    name: Protected validator maintenance diagnostic only
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes this reviewed workflow from the default branch.
      # Do not check out the producer head, merge ref, or an artifact as code.
      - name: Checkout reviewed default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted checkout and acquire diagnostic evidence
        shell: pwsh
        env:
          ACCESS_TOKEN: ${{ github.token }}
          PRODUCER_WORKFLOW_ID: '368289188' # Existing registered producer; diagnostic evidence only.
        run: |
          $ErrorActionPreference = 'Stop'
          $checkedOut = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -cne $env:GITHUB_SHA) {
            throw 'BLOCKED|Protected checkout differs from the default-branch event SHA.'
          }
          $workflowId = [long]$env:PRODUCER_WORKFLOW_ID
          if ($workflowId -lt 1) {
            throw 'BLOCKED|Reviewed producer workflow ID has not been configured.'
          }
          $testIds = @(
            'UnitT10_pins_every_checkout_and_disables_persisted_credentials',
            'UnitT15_runs_linux_callback_containment_before_full_suites_and_authority_gate',
            'UnitT20_runs_dedicated_authority_CI_for_every_authority_file_and_bridge_change',
            'UnitT30_checks_the_actual_event_commit_range_instead_of_an_empty_main_range',
            'UnitT40_routes_managed_lifecycle_changes_through_the_central_authority_gate',
            'UnitT50_routes_upstream_interoperability_changes_through_the_central_authority_gate',
            'UnitT60_routes_validation_security_gate_changes_through_the_central_authority_gate',
            'UnitT70_rejects_consumer_alternate_gates_but_preserves_authority_workflow_roles'
            'UnitT03_rejects_wrong_candidate_maintenance_report_from_protected_inputs'
            'UnitT50_binds_injected_maintenance_metadata_and_rejects_cross_run_or_archive_drift'
          )
          $token = ConvertTo-SecureString -String $env:ACCESS_TOKEN -AsPlainText -Force
          $result = & ./scripts/Invoke-StandardValidatorMaintenanceProtectedConsumer.ps1 `
            -EventName $env:GITHUB_EVENT_NAME -EventPath $env:GITHUB_EVENT_PATH `
            -RepositoryFullName 'SyuanTsai/SyuanTsai-AI-Instructions' `
            -RepositoryId 1245177039 -WorkflowId $workflowId `
            -AuthorityRevision 'e69c453888db93e2d2697ea7f0b11df13cd1b8d2' `
            -TestIds $testIds -AccessToken $token `
            -OutputRoot (Join-Path $env:RUNNER_TEMP ('validator-maintenance-protected-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT))
          if ($result.ciAdmission -cne 'BLOCKED' -or $result.releaseEligible -ne $false) {
            throw 'BLOCKED|Maintenance diagnostic cannot grant CI admission.'
          }
          Write-Host ('Diagnostic verifier: {0}; CI admission: {1}' -f $result.verifierStatus, $result.ciAdmission)
