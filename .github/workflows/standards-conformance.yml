name: Standards Conformance

on:
  push:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'scripts/Resolve-PythonWheelClosure.py'
      - 'scripts/Invoke-StandardAuthorityGate.ps1'
      - 'scripts/Invoke-StandardValidation.ps1'
      - 'scripts/Validate-UpstreamAdapter.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - 'tests/standard-validation-runner.Tests.ps1'
      - '.github/actions/capture-artifact-service/**'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
      - '.github/workflows/syp101-production-smoke.yml'
      - '.github/workflows/syp86-production-lock.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'scripts/Resolve-PythonWheelClosure.py'
      - 'scripts/Invoke-StandardAuthorityGate.ps1'
      - 'scripts/Invoke-StandardValidation.ps1'
      - 'scripts/Validate-UpstreamAdapter.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - 'tests/standard-validation-runner.Tests.ps1'
      - '.github/actions/capture-artifact-service/**'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
      - '.github/workflows/syp101-production-smoke.yml'
      - '.github/workflows/syp86-production-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable-authority-regression:
    name: Standard v1 (latest stable tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goApplication = Get-Command -Name go -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $goCommandPath = if ($null -ne $goApplication.PSObject.Properties['Path']) { [string]$goApplication.Path } else { [string]$goApplication.Source }
          if ([string]::IsNullOrWhiteSpace($goCommandPath) -or -not [IO.Path]::IsPathRooted($goCommandPath)) { throw "setup-go returned a non-absolute Go path: $goCommandPath" }
          $versionOutput = @(& $goCommandPath version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STANDARD_GO_COMMAND_PATH=$goCommandPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 authority gate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Invoke-StandardAuthorityGate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -GoCommandPath $env:STANDARD_GO_COMMAND_PATH

      - name: Check whitespace in the event range
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff-tree --check --root -r HEAD
          fi

  pr33-adoption-evidence-development-only:
    name: SYP-154 PR33 adoption evidence (development only)
    if: github.event_name == 'workflow_dispatch'
    needs:
      - latest-stable-authority-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SYP154_DARKTIDE_REPOSITORY: https://github.com/SyuanTsai/Skill-Darktide-Translate.git
      SYP154_CANDIDATE_COMMIT: 7519745266e0cd67b057e88c0ee63e702ccd1e10
      SYP154_CANDIDATE_TREE: 654934a3f1f412bc5ccda89bda0f9158cb4d328a
      SYP154_LAUNCHER_COMMIT: fcad2bcbfd3cc43296e1687a9874ad1975d22181
      SYP154_LAUNCHER_TREE: 582037d13e36ad842e0b33b2f552e278260df2c6
      SYP154_ORACLE_COMMIT: c3bb5e49ee34e37418703ca2bf9a89c8bc5abfe8
      SYP154_ORACLE_TREE: 4332d9a1a366d6ff238cde3fe33912cca7dd2050
    steps:
      - name: Materialize exact local artifact authority action
        shell: bash
        run: |
          set -euo pipefail
          workflow_repository='https://github.com/SyuanTsai/SyuanTsai-AI-Instructions.git'
          workspace="$GITHUB_WORKSPACE"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -d "$workspace" && ! -L "$workspace" ]]
          [[ -z "$(find "$workspace" -mindepth 1 -maxdepth 1 -print -quit)" ]]
          git -C "$workspace" init
          git -C "$workspace" remote add origin "$workflow_repository"
          git -C "$workspace" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          [[ "$(git -C "$workspace" rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          git -C "$workspace" checkout --detach FETCH_HEAD
          [[ "$(git -C "$workspace" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -C "$workspace" status --porcelain=v1 --untracked-files=all)" ]]

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goApplication = Get-Command -Name go -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $goCommandPath = if ($null -ne $goApplication.PSObject.Properties['Path']) { [string]$goApplication.Path } else { [string]$goApplication.Source }
          if ([string]::IsNullOrWhiteSpace($goCommandPath) -or -not [IO.Path]::IsPathRooted($goCommandPath)) { throw "setup-go returned a non-absolute Go path: $goCommandPath" }
          $versionOutput = @(& $goCommandPath version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STANDARD_GO_COMMAND_PATH=$goCommandPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire and bind immutable launcher oracle and PR33 candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/syp154-pr33-candidate"
          launcher_root="$RUNNER_TEMP/syp154-pr33-launcher"
          artifacts_root="$RUNNER_TEMP/syp154-pr33-artifacts"
          export_root="$RUNNER_TEMP/syp154-pr33-evidence-export"
          supervisor_root="/var/lib/syp154-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          actions_root="$(/usr/bin/dirname "$RUNNER_TEMP")/_actions"
          upload_action_root="$actions_root/actions/upload-artifact/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
          upload_action_parent="$(/usr/bin/dirname "$upload_action_root")"
          [[ "$supervisor_root" =~ ^/var/lib/syp154-evidence-[0-9]+-[0-9]+$ ]]
          [[ "$actions_root" == '/home/runner/work/_actions' ]]
          [[ -d "$actions_root" && ! -L "$actions_root" ]]
          [[ "$(/usr/bin/realpath -e "$actions_root")" == "$actions_root" ]]
          [[ "$upload_action_root" =~ ^/home/runner/work/_actions/actions/upload-artifact/[0-9a-f]{40}$ ]]
          [[ -d "$upload_action_parent" && ! -L "$upload_action_parent" ]]
          [[ "$(/usr/bin/realpath -e "$upload_action_parent")" == "$upload_action_parent" ]]
          [[ -d "$upload_action_root" && ! -L "$upload_action_root" ]]
          [[ ! -e "$supervisor_root" ]]
          sudo -n install -d -m 0755 -o root -g root -- "$supervisor_root"
          sudo -n cp -a -- "$upload_action_root" "$supervisor_root/upload-artifact"
          sudo -n chown -R root:root -- "$supervisor_root/upload-artifact"
          sudo -n chmod -R a-w -- "$supervisor_root/upload-artifact"
          /usr/bin/sudo -n /usr/bin/chown -R root:root -- "$actions_root"
          /usr/bin/sudo -n /usr/bin/chmod -R a-w -- "$actions_root"
          [[ "$(/usr/bin/stat -c '%u:%g:%a' "$actions_root")" == '0:0:555' ]]
          for root in "$candidate_root" "$launcher_root" "$artifacts_root"; do
            if [[ -e "$root" ]]; then
              echo "Evidence root already exists: $root" >&2
              exit 1
            fi
          done
          if [[ -e "$export_root" ]]; then
            echo "Evidence export root already exists before acquisition: $export_root" >&2
            exit 1
          fi
          mkdir -- "$candidate_root" "$launcher_root" "$artifacts_root"
          git -C "$candidate_root" init
          git -C "$candidate_root" remote add origin "$SYP154_DARKTIDE_REPOSITORY"
          git -C "$candidate_root" fetch --no-tags origin \
            '+refs/heads/codex/SYP-154-v3-p06-implementation:refs/remotes/evidence/candidate' \
            '+refs/heads/codex/SYP-158-trusted-file-contract:refs/remotes/evidence/launcher' \
            '+refs/heads/main:refs/remotes/evidence/oracle'
          [[ "$(git -C "$candidate_root" rev-parse refs/remotes/evidence/candidate)" == "$SYP154_CANDIDATE_COMMIT" ]]
          [[ "$(git -C "$candidate_root" rev-parse refs/remotes/evidence/launcher)" == "$SYP154_LAUNCHER_COMMIT" ]]
          [[ "$(git -C "$candidate_root" rev-parse refs/remotes/evidence/oracle)" == "$SYP154_ORACLE_COMMIT" ]]
          [[ "$(git -C "$candidate_root" rev-parse "$SYP154_CANDIDATE_COMMIT^{tree}")" == "$SYP154_CANDIDATE_TREE" ]]
          [[ "$(git -C "$candidate_root" rev-parse "$SYP154_LAUNCHER_COMMIT^{tree}")" == "$SYP154_LAUNCHER_TREE" ]]
          [[ "$(git -C "$candidate_root" rev-parse "$SYP154_ORACLE_COMMIT^{tree}")" == "$SYP154_ORACLE_TREE" ]]
          git -C "$candidate_root" merge-base --is-ancestor "$SYP154_ORACLE_COMMIT" "$SYP154_CANDIDATE_COMMIT"
          git -C "$candidate_root" checkout --detach "$SYP154_CANDIDATE_COMMIT"
          [[ -z "$(git -C "$candidate_root" status --porcelain=v1 --untracked-files=all)" ]]
          git -C "$candidate_root" diff --check "$SYP154_ORACLE_COMMIT...$SYP154_CANDIDATE_COMMIT"
          git -C "$candidate_root" archive "$SYP154_LAUNCHER_COMMIT" \
            scripts/Validate.ps1 scripts/Test-Repository.ps1 | tar -x -C "$launcher_root"

          launcher_inventory=(
            'scripts/Validate.ps1:ea3d44794726b6e376fb15871d255940ac754dc6'
            'scripts/Test-Repository.ps1:5ae4b630f69893cb6cd5927ef9c513056e89e3f1'
          )
          oracle_inventory=(
            'tests/BootstrapTransition.Tests.ps1:bb4dd7b3e5c3bd4085572c8400885e76f98031dd'
            'tests/LocalizationWorkset.Tests.ps1:abbfc0ac6f7a8762a48b6b9c860ef1f48cddcb54'
            'tests/ModUpdateAutomation.Tests.ps1:f67a6aa9050a5ab9718b7c5d450584fa402b28c2'
            'tests/RepositoryContract.Tests.ps1:de5fa4f2efe3fa33d0dea23f1b616ec210cdc2bb'
            'tests/RepositoryValidation.Tests.ps1:13e22b4522087b50b345736a4208dfd388ea148d'
            'tests/Schema15Coordination.Tests.ps1:94c7990fff669164755a52e5937f34b677c8de53'
            'tests/Schema15SourceAcquisition.Tests.ps1:84f141aca53aaeae7e93aefdbf4e30d5af1be6a7'
            'tests/SkillContract.Tests.ps1:b87401c01a671b978529066d71f3f0a44bf17d2a'
            'tests/SourcePin.Tests.ps1:6304768b79f063558f978e71cab59d9554c4e5ce'
          )
          for entry in "${launcher_inventory[@]}"; do
            path="${entry%%:*}"
            expected_blob="${entry##*:}"
            actual_blob="$(git -C "$candidate_root" rev-parse "$SYP154_LAUNCHER_COMMIT:$path")"
            materialized_blob="$(git hash-object "$launcher_root/$path")"
            [[ "$actual_blob" == "$expected_blob" && "$materialized_blob" == "$expected_blob" ]]
          done
          for entry in "${oracle_inventory[@]}"; do
            path="${entry%%:*}"
            expected_blob="${entry##*:}"
            actual_blob="$(git -C "$candidate_root" rev-parse "$SYP154_ORACLE_COMMIT:$path")"
            [[ "$actual_blob" == "$expected_blob" ]]
          done
          chmod -R a-w -- "$candidate_root" "$launcher_root"
          sudo -n cp -a -- "$candidate_root/.git" "$supervisor_root/candidate.git"
          sudo -n cp -a -- "$launcher_root" "$supervisor_root/launcher"
          sudo -n chown -R root:root -- "$supervisor_root/candidate.git" "$supervisor_root/launcher"
          sudo -n chmod -R a-w -- "$supervisor_root/candidate.git" "$supervisor_root/launcher"
          {
            printf 'acquisitionComplete=1\n'
            printf 'runnerOs=%s\n' "$RUNNER_OS"
            printf 'runnerArch=%s\n' "$RUNNER_ARCH"
            printf 'imageOs=%s\n' "${ImageOS:-unknown}"
            printf 'imageVersion=%s\n' "${ImageVersion:-unknown}"
            /usr/bin/uname -a
            /usr/bin/git --version
            /usr/bin/pwsh --version
            "$STANDARD_GO_COMMAND_PATH" version
            /usr/bin/stat --version | /usr/bin/head -n 1
            /usr/bin/unshare --version
          } | sudo -n tee -- "$supervisor_root/acquisition-witness.txt" >/dev/null
          sudo -n chmod 0444 -- "$supervisor_root/acquisition-witness.txt"
          {
            printf 'SYP154_CANDIDATE_ROOT=%s\n' "$candidate_root"
            printf 'SYP154_LAUNCHER_ROOT=%s\n' "$supervisor_root/launcher"
            printf 'SYP154_ARTIFACTS_ROOT=%s\n' "$artifacts_root"
            printf 'SYP154_EXPORT_ROOT=%s\n' "$export_root"
          } >> "$GITHUB_ENV"

      - name: Snapshot trusted artifact-service authority
        uses: ./.github/actions/capture-artifact-service

      - name: Delegate Linux cgroup v2 subtree
        shell: bash
        run: |
          set -euo pipefail
          cgroup_parent="/sys/fs/cgroup/codex-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]
          controllers="$(< /sys/fs/cgroup/cgroup.controllers)"
          [[ " $controllers " =~ [[:space:]]memory[[:space:]] ]]
          [[ " $controllers " =~ [[:space:]]cpu[[:space:]] ]]
          controllers_to_enable='+cpu +memory'
          if [[ " $controllers " =~ [[:space:]]pids[[:space:]] ]]; then
            controllers_to_enable+=' +pids'
          fi
          printf '%s\n' "$controllers_to_enable" | sudo -n tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          [[ ! -e "$cgroup_parent" ]]
          cgroup_delegated="$cgroup_parent/delegated"
          cgroup_supervisor="$cgroup_delegated/trusted-validator"
          sudo -n install -d -m 0755 -o root -g root -- "$cgroup_parent"
          [[ "$(sudo -n stat -c '%u:%g:%a' "$cgroup_parent")" == '0:0:755' ]]
          printf '%s\n' '2147483648' | sudo -n tee "$cgroup_parent/memory.max" >/dev/null
          [[ "$(< "$cgroup_parent/memory.max")" == '2147483648' ]]
          if [[ -e "$cgroup_parent/pids.max" ]]; then
            printf '%s\n' '256' | sudo -n tee "$cgroup_parent/pids.max" >/dev/null
            [[ "$(< "$cgroup_parent/pids.max")" == '256' ]]
          fi
          printf '%s\n' "$controllers_to_enable" | sudo -n tee "$cgroup_parent/cgroup.subtree_control" >/dev/null
          sudo -n mkdir -- "$cgroup_delegated"
          printf '%s\n' "$controllers_to_enable" | sudo -n tee "$cgroup_delegated/cgroup.subtree_control" >/dev/null
          for delegation_file in \
            "$cgroup_delegated/cgroup.procs" \
            "$cgroup_delegated/cgroup.threads" \
            "$cgroup_delegated/cgroup.subtree_control"; do
            sudo -n chown "$(id -u):$(id -g)" -- "$delegation_file"
          done
          sudo -n chown "$(id -u):$(id -g)" -- "$cgroup_delegated"
          sudo -n chmod 0755 -- "$cgroup_delegated"
          mkdir -- "$cgroup_supervisor"
          [[ ! -w "$cgroup_parent/cgroup.procs" && -w "$cgroup_delegated" && -w "$cgroup_supervisor" ]]
          {
            printf 'CODEX_PESTER_CGROUP_ROOT=%s\n' "$cgroup_delegated"
            printf 'CODEX_PESTER_VALIDATOR_CGROUP=%s\n' "$cgroup_supervisor"
          } >> "$GITHUB_ENV"

      - name: Prove unprivileged Linux namespace capability
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sysctl -w kernel.unprivileged_userns_clone=1
          if sudo -n sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --kill-child=SIGKILL -- true

      - name: Validate immutable PR33 candidate with independent oracle
        id: pr33-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $validatorCgroup = [string]$env:CODEX_PESTER_VALIDATOR_CGROUP
          if ($validatorCgroup -notmatch '^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+/delegated/trusted-validator$') {
            throw 'The trusted evidence validator cgroup path is missing or invalid.'
          }
          [string]$PID | & sudo -n tee -- (Join-Path $validatorCgroup 'cgroup.procs') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not place the trusted evidence validator inside its delegated cgroup.' }
          $relativeValidatorCgroup = $validatorCgroup.Substring('/sys/fs/cgroup'.Length)
          $currentCgroup = [IO.File]::ReadAllText("/proc/$PID/cgroup").Trim()
          if ($currentCgroup -notmatch ("0::" + [regex]::Escape($relativeValidatorCgroup) + '$')) {
            throw 'The trusted evidence validator did not enter its delegated cgroup.'
          }
          $candidateRoot = [IO.Path]::GetFullPath($env:SYP154_CANDIDATE_ROOT)
          $artifactsRoot = [IO.Path]::GetFullPath($env:SYP154_ARTIFACTS_ROOT)
          $outputPath = Join-Path $artifactsRoot 'pr33-conformance-report.json'
          $validatorPath = Join-Path $env:SYP154_LAUNCHER_ROOT 'scripts/Validate.ps1'
          $previousGithubSha = [Environment]::GetEnvironmentVariable('GITHUB_SHA', [EnvironmentVariableTarget]::Process)
          $previousSupervisorCommit = [Environment]::GetEnvironmentVariable('TRUSTED_SUPERVISOR_COMMIT', [EnvironmentVariableTarget]::Process)
          $validationError = $null
          try {
            [Environment]::SetEnvironmentVariable('GITHUB_SHA', $env:SYP154_ORACLE_COMMIT, [EnvironmentVariableTarget]::Process)
            [Environment]::SetEnvironmentVariable('TRUSTED_SUPERVISOR_COMMIT', $env:SYP154_ORACLE_COMMIT, [EnvironmentVariableTarget]::Process)
            & $validatorPath `
              -RepositoryRoot $candidateRoot `
              -ArtifactsRoot $artifactsRoot `
              -BaseCommit $env:SYP154_ORACLE_COMMIT `
              -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION `
              -OutputPath $outputPath
          }
          catch {
            $validationError = $_
          }
          finally {
            [Environment]::SetEnvironmentVariable('GITHUB_SHA', $previousGithubSha, [EnvironmentVariableTarget]::Process)
            [Environment]::SetEnvironmentVariable('TRUSTED_SUPERVISOR_COMMIT', $previousSupervisorCommit, [EnvironmentVariableTarget]::Process)
          }
          $supervisorRoot = "/var/lib/syp154-evidence-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          if ($supervisorRoot -notmatch '^/var/lib/syp154-evidence-[0-9]+-[0-9]+$') {
            throw 'The trusted evidence supervisor root is invalid.'
          }
          $summaryPaths = @(Get-ChildItem -LiteralPath $artifactsRoot -Filter 'security-preflight-summary.json' -File -Recurse -Force)
          if ($summaryPaths.Count -gt 1) { throw 'Expected at most one bounded security preflight summary.' }
          if ($summaryPaths.Count -eq 1) {
            $summarySha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $summaryPaths[0].FullName).Hash.ToLowerInvariant()
            $summarySha256 | & sudo -n tee -- (Join-Path $supervisorRoot 'security-summary.sha256') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the trusted security summary digest.' }
            & sudo -n chmod 0444 -- (Join-Path $supervisorRoot 'security-summary.sha256')
            if ($LASTEXITCODE -ne 0) { throw 'Could not protect the trusted security summary digest.' }
          }
          if ($null -ne $validationError) { throw $validationError }
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) { throw 'PR33 conformance evidence is missing.' }
          $evidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $outputPath).Hash.ToLowerInvariant()
          $evidenceSha256 | & sudo -n tee -- (Join-Path $supervisorRoot 'report.sha256') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the trusted conformance report digest.' }
          & sudo -n chmod 0444 -- (Join-Path $supervisorRoot 'report.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'Could not protect the trusted conformance report digest.' }
          "pr33_evidence_sha256=$evidenceSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove delegated Linux cgroup subtree
        id: cleanup_cgroup
        if: ${{ always() }}
        shell: /usr/bin/sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          cgroup_parent="/sys/fs/cgroup/codex-validation-${{ github.run_id }}-${{ github.run_attempt }}"
          [[ "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]
          if [[ -e "$cgroup_parent" ]]; then
            [[ "$(/usr/bin/stat -c '%u:%g:%a' "$cgroup_parent")" == '0:0:755' ]]
            [[ -f "$cgroup_parent/cgroup.kill" && -f "$cgroup_parent/cgroup.events" ]]
            /usr/bin/printf '%s\n' '1' > "$cgroup_parent/cgroup.kill"
            cgroup_unpopulated=0
            for cleanup_attempt in {1..120}; do
              if /usr/bin/grep -qx 'populated 0' "$cgroup_parent/cgroup.events"; then
                cgroup_unpopulated=1
                break
              fi
              /usr/bin/sleep 0.025
            done
            [[ "$cgroup_unpopulated" == '1' ]]
            mapfile -t descendant_cgroups < <(/usr/bin/find "$cgroup_parent" -mindepth 1 -depth -type d -print)
            for descendant_cgroup in "${descendant_cgroups[@]}"; do
              /usr/bin/rmdir -- "$descendant_cgroup"
            done
            /usr/bin/rmdir -- "$cgroup_parent"
            [[ ! -e "$cgroup_parent" ]]
          fi

      - name: Finalize bounded evidence export
        id: finalize_evidence
        if: ${{ always() && steps.cleanup_cgroup.outcome == 'success' }}
        shell: /usr/bin/sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          runner_temp='${{ runner.temp }}'
          evidence_job_status='${{ job.status }}'
          repository='https://github.com/SyuanTsai/Skill-Darktide-Translate.git'
          candidate_commit='7519745266e0cd67b057e88c0ee63e702ccd1e10'
          candidate_tree='654934a3f1f412bc5ccda89bda0f9158cb4d328a'
          launcher_commit='fcad2bcbfd3cc43296e1687a9874ad1975d22181'
          launcher_tree='582037d13e36ad842e0b33b2f552e278260df2c6'
          oracle_commit='c3bb5e49ee34e37418703ca2bf9a89c8bc5abfe8'
          oracle_tree='4332d9a1a366d6ff238cde3fe33912cca7dd2050'
          candidate_root="$runner_temp/syp154-pr33-candidate"
          artifacts_root="$runner_temp/syp154-pr33-artifacts"
          export_root="$runner_temp/syp154-pr33-evidence-export"
          supervisor_root="/var/lib/syp154-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
          artifact_service_file="$supervisor_root/artifact-service.env"
          upload_action_root="$(/usr/bin/dirname "$runner_temp")/_actions/actions/upload-artifact/043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
          upload_action_parent="$(/usr/bin/dirname "$upload_action_root")"
          [[ "$supervisor_root" =~ ^/var/lib/syp154-evidence-[0-9]+-[0-9]+$ ]]
          [[ "$upload_action_root" =~ ^/home/runner/work/_actions/actions/upload-artifact/[0-9a-f]{40}$ ]]
          [[ -d "$upload_action_parent" && ! -L "$upload_action_parent" ]]
          [[ "$(/usr/bin/realpath -e "$upload_action_parent")" == "$upload_action_parent" ]]
          cleanup_supervisor() { /bin/rm -rf -- "$supervisor_root"; }
          trap cleanup_supervisor EXIT
          /bin/rm -rf -- "$export_root"
          /usr/bin/install -d -m 0755 -o root -g root -- "$export_root"

          acquisition_complete=0
          witness="$supervisor_root/acquisition-witness.txt"
          [[ -d "$supervisor_root/upload-artifact" ]]
          [[ "$(/usr/bin/stat -c '%u:%g:%a' "$supervisor_root/upload-artifact")" == '0:0:555' ]]
          [[ -f "$artifact_service_file" && ! -L "$artifact_service_file" ]]
          [[ "$(/usr/bin/stat -c '%u:%g:%a' "$artifact_service_file")" == '0:0:400' ]]
          if [[ -f "$witness" ]]; then
            [[ -d "$supervisor_root/candidate.git" && -d "$supervisor_root/launcher" ]]
            [[ "$(/usr/bin/stat -c '%u:%g:%a' "$witness")" == '0:0:444' ]]
            [[ "$(/usr/bin/head -n 1 "$witness")" == 'acquisitionComplete=1' ]]
            acquisition_complete=1
          fi

          if [[ "$acquisition_complete" == '1' ]]; then
            launcher_root="$supervisor_root/launcher"
            git_command=(/usr/bin/git --git-dir="$supervisor_root/candidate.git" --work-tree="$candidate_root" -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper=)
            [[ "$("${git_command[@]}" rev-parse refs/remotes/evidence/candidate)" == "$candidate_commit" ]]
            [[ "$("${git_command[@]}" rev-parse refs/remotes/evidence/launcher)" == "$launcher_commit" ]]
            [[ "$("${git_command[@]}" rev-parse refs/remotes/evidence/oracle)" == "$oracle_commit" ]]
            [[ "$("${git_command[@]}" rev-parse "$candidate_commit^{tree}")" == "$candidate_tree" ]]
            [[ "$("${git_command[@]}" rev-parse "$launcher_commit^{tree}")" == "$launcher_tree" ]]
            [[ "$("${git_command[@]}" rev-parse "$oracle_commit^{tree}")" == "$oracle_tree" ]]
            [[ -z "$("${git_command[@]}" status --porcelain=v1 --untracked-files=all)" ]]
            "${git_command[@]}" diff --no-ext-diff --check "$oracle_commit...$candidate_commit"
            "${git_command[@]}" diff --no-ext-diff --name-status "$oracle_commit...$candidate_commit" > "$export_root/candidate-diff.txt"

            launcher_inventory=(
              'scripts/Validate.ps1:ea3d44794726b6e376fb15871d255940ac754dc6'
              'scripts/Test-Repository.ps1:5ae4b630f69893cb6cd5927ef9c513056e89e3f1'
            )
            oracle_inventory=(
              'tests/BootstrapTransition.Tests.ps1:bb4dd7b3e5c3bd4085572c8400885e76f98031dd'
              'tests/LocalizationWorkset.Tests.ps1:abbfc0ac6f7a8762a48b6b9c860ef1f48cddcb54'
              'tests/ModUpdateAutomation.Tests.ps1:f67a6aa9050a5ab9718b7c5d450584fa402b28c2'
              'tests/RepositoryContract.Tests.ps1:de5fa4f2efe3fa33d0dea23f1b616ec210cdc2bb'
              'tests/RepositoryValidation.Tests.ps1:13e22b4522087b50b345736a4208dfd388ea148d'
              'tests/Schema15Coordination.Tests.ps1:94c7990fff669164755a52e5937f34b677c8de53'
              'tests/Schema15SourceAcquisition.Tests.ps1:84f141aca53aaeae7e93aefdbf4e30d5af1be6a7'
              'tests/SkillContract.Tests.ps1:b87401c01a671b978529066d71f3f0a44bf17d2a'
              'tests/SourcePin.Tests.ps1:6304768b79f063558f978e71cab59d9554c4e5ce'
            )
            : > "$export_root/launcher-inventory.tsv"
            for entry in "${launcher_inventory[@]}"; do
              path="${entry%%:*}"
              expected_blob="${entry##*:}"
              actual_blob="$("${git_command[@]}" rev-parse "$launcher_commit:$path")"
              materialized_blob="$("${git_command[@]}" hash-object "$launcher_root/$path")"
              [[ "$actual_blob" == "$expected_blob" && "$materialized_blob" == "$expected_blob" ]]
              printf '%s\t%s\t%s\n' "$path" "$expected_blob" "$(/usr/bin/sha256sum "$launcher_root/$path" | /usr/bin/cut -d' ' -f1)" >> "$export_root/launcher-inventory.tsv"
            done
            : > "$export_root/oracle-inventory.tsv"
            for entry in "${oracle_inventory[@]}"; do
              path="${entry%%:*}"
              expected_blob="${entry##*:}"
              actual_blob="$("${git_command[@]}" rev-parse "$oracle_commit:$path")"
              [[ "$actual_blob" == "$expected_blob" ]]
              printf '%s\t%s\n' "$path" "$expected_blob" >> "$export_root/oracle-inventory.tsv"
            done
          fi

          cat > "$export_root/identity-manifest.json" <<JSON
          {
            "schemaVersion": 1,
            "purpose": "syp154-pr33-adoption-evidence-development-only",
            "repository": "$repository",
            "candidate": { "commit": "$candidate_commit", "tree": "$candidate_tree" },
            "launcher": { "commit": "$launcher_commit", "tree": "$launcher_tree" },
            "oracle": { "commit": "$oracle_commit", "tree": "$oracle_tree" },
            "releaseEligible": false,
            "formalAdoption": "not-authorized"
          }
          JSON
          {
            printf 'jobStatus=%s\n' "$evidence_job_status"
            if [[ "$acquisition_complete" == '1' ]]; then
              /usr/bin/tail -n +2 "$witness"
            else
              printf 'runnerOs=Linux\nrunnerArch=X64\nimageOs=unknown\nimageVersion=unknown\n'
              /usr/bin/uname -a
              /usr/bin/git --version
              /usr/bin/pwsh --version
              /usr/bin/stat --version | /usr/bin/head -n 1
              /usr/bin/unshare --version
            fi
          } > "$export_root/runtime.txt"
          report="$artifacts_root/pr33-conformance-report.json"
          expected_report_sha256=''
          if [[ -f "$supervisor_root/report.sha256" ]]; then
            [[ "$(/usr/bin/stat -c '%u:%g:%a' "$supervisor_root/report.sha256")" == '0:0:444' ]]
            IFS= read -r expected_report_sha256 < "$supervisor_root/report.sha256"
            [[ "$expected_report_sha256" =~ ^[0-9a-f]{64}$ ]]
          fi
          if [[ -f "$report" ]]; then
            [[ -n "$expected_report_sha256" ]]
            actual_sha256="$(/usr/bin/sha256sum "$report" | /usr/bin/cut -d' ' -f1)"
            if [[ "$actual_sha256" != "$expected_report_sha256" ]]; then
              echo 'Conformance report changed after the trusted validator returned.' >&2
              exit 1
            fi
            /usr/bin/cp -- "$report" "$export_root/pr33-conformance-report.json"
            printf '%s  %s\n' "$actual_sha256" 'pr33-conformance-report.json' > "$export_root/report.sha256"
          elif [[ -n "$expected_report_sha256" ]]; then
            echo 'The trusted conformance report disappeared before finalization.' >&2
            exit 1
          fi
          mapfile -t summaries < <(/usr/bin/find "$artifacts_root" -type f -name security-preflight-summary.json -print)
          if (( ${#summaries[@]} > 1 )); then
            echo 'Expected at most one bounded security preflight summary.' >&2
            exit 1
          fi
          if (( ${#summaries[@]} == 1 )); then
            [[ -f "$supervisor_root/security-summary.sha256" ]]
            [[ "$(/usr/bin/stat -c '%u:%g:%a' "$supervisor_root/security-summary.sha256")" == '0:0:444' ]]
            IFS= read -r expected_summary_sha256 < "$supervisor_root/security-summary.sha256"
            [[ "$expected_summary_sha256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(/usr/bin/sha256sum "${summaries[0]}" | /usr/bin/cut -d' ' -f1)" == "$expected_summary_sha256" ]]
            /usr/bin/cp -- "${summaries[0]}" "$export_root/security-preflight-summary.json"
            /usr/bin/sha256sum "$export_root/security-preflight-summary.json" > "$export_root/security-preflight-summary.sha256"
          elif [[ -f "$supervisor_root/security-summary.sha256" ]]; then
            echo 'The trusted security preflight summary disappeared before finalization.' >&2
            exit 1
          fi
          {
            /usr/bin/find "$export_root" -maxdepth 1 -type f \
              ! -name export-inventory.txt ! -name export-sha256.tsv -printf '%f\n'
            printf '%s\n' export-inventory.txt export-sha256.tsv
          } | LC_ALL=C sort > "$export_root/export-inventory.txt"
          while IFS= read -r exported_file; do
            if [[ "$exported_file" == 'export-sha256.tsv' ]]; then
              continue
            fi
            printf '%s\t%s\n' "$(/usr/bin/sha256sum "$export_root/$exported_file" | /usr/bin/cut -d' ' -f1)" "$exported_file"
          done < "$export_root/export-inventory.txt" > "$export_root/export-sha256.tsv"
          /usr/bin/find "$export_root" -maxdepth 1 -type f -exec /usr/bin/chmod 0444 -- '{}' +
          /usr/bin/chmod 0555 -- "$export_root"
          /bin/rm -rf -- "$upload_action_root"
          /usr/bin/cp -a -- "$supervisor_root/upload-artifact" "$upload_action_root"
          /usr/bin/chown -R root:root -- "$upload_action_root"
          /usr/bin/chmod -R a-w -- "$upload_action_root"
          [[ "$(/usr/bin/stat -c '%u:%g:%a' "$upload_action_root")" == '0:0:555' ]]

          environment_file='${{ github.env }}'
          [[ "$environment_file" =~ ^/home/runner/work/_temp/_runner_file_commands/set_env_[0-9a-fA-F-]{36}$ ]]
          [[ -f "$environment_file" && ! -L "$environment_file" ]]
          [[ "$(/usr/bin/realpath -e "$environment_file")" == "$environment_file" ]]
          [[ "$(/usr/bin/stat -c '%h' "$environment_file")" == '1' ]]
          [[ "$(/usr/bin/stat -c '%u' "$environment_file")" == "$(/usr/bin/stat -c '%u' "$runner_temp")" ]]
          /usr/bin/printf '%s\n' \
            'HTTPS_PROXY=' 'https_proxy=' \
            'HTTP_PROXY=' 'http_proxy=' \
            'ALL_PROXY=' 'all_proxy=' \
            'NO_PROXY=' 'no_proxy=' \
            'NODE_TLS_REJECT_UNAUTHORIZED=' 'NODE_EXTRA_CA_CERTS=' \
            'SSL_CERT_FILE=' 'SSL_CERT_DIR=' \
            'OPENSSL_CONF=' 'OPENSSL_MODULES=' >> "$environment_file"
          mapfile -t artifact_service_lines < "$artifact_service_file"
          artifact_service_names=(ACTIONS_RESULTS_URL ACTIONS_RUNTIME_URL ACTIONS_RUNTIME_TOKEN)
          (( ${#artifact_service_lines[@]} == ${#artifact_service_names[@]} ))
          for artifact_service_index in "${!artifact_service_names[@]}"; do
            artifact_service_name="${artifact_service_names[$artifact_service_index]}"
            artifact_service_line="${artifact_service_lines[$artifact_service_index]}"
            [[ "$artifact_service_line" == "$artifact_service_name="* ]]
            artifact_service_value="${artifact_service_line#*=}"
            [[ -n "$artifact_service_value" ]]
            [[ "$artifact_service_value" != *$'\r'* && "$artifact_service_value" != *$'\n'* ]]
            /usr/bin/printf '%s=%s\n' "$artifact_service_name" "$artifact_service_value" >> "$environment_file"
          done

      - name: Upload bounded PR33 adoption evidence
        if: ${{ always() && steps.finalize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          PATH: /usr/sbin:/usr/bin:/sbin:/bin
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: /dev/null
          ENV: /dev/null
          HTTPS_PROXY: ''
          HTTP_PROXY: ''
          ALL_PROXY: ''
          NO_PROXY: ''
          NODE_TLS_REJECT_UNAUTHORIZED: ''
          NODE_EXTRA_CA_CERTS: ''
          SSL_CERT_FILE: ''
          SSL_CERT_DIR: ''
          OPENSSL_CONF: ''
          OPENSSL_MODULES: ''
        with:
          name: syp154-pr33-adoption-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/syp154-pr33-evidence-export
          if-no-files-found: error
          retention-days: 14
