name: Standards Conformance

on:
  push:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable-authority-regression:
    name: Standard v1 (latest stable tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate central tool sources and policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'standard-validation-policy.json'
          & ./scripts/Resolve-StandardValidationTool.ps1 -ValidatePolicyOnly -OutputPath $receiptPath | Out-Host
          $receipt = Get-Content -Raw -Encoding UTF8 -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.policy -ne 'latest-stable-per-validation-run') { throw 'Unexpected validation tool policy.' }
          if ($receipt.sourceTrust.enforcement -ne 'exact-approved-source') { throw 'Unexpected source trust enforcement.' }
          if (-not [bool]$receipt.sourceTrust.failClosedOnMismatch) { throw 'Source trust must fail closed.' }
          if (-not [bool]$receipt.recordResolvedIdentityWhenAvailable) { throw 'Resolved identity recording is not enforced.' }
          Write-Host "Canonical validation policy: $($receipt.policy)"
          Write-Host "Tool source enforcement: $($receipt.sourceTrust.enforcement)"

      - name: Resolve and install latest stable SkillSpector from locked dependency closure
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'standard-validation-skillspector.json'
          & ./scripts/Resolve-StandardValidationTool.ps1 -ToolName skillspector -Install -OutputPath $receiptPath | Out-Host
          $receipt = Get-Content -Raw -Encoding UTF8 -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.source -ne 'NVIDIA/SkillSpector') { throw "Unexpected SkillSpector source '$($receipt.source)'." }
          if ($receipt.pythonPackageIndex -notmatch '^https://pypi\.org/simple/?$') { throw "Unexpected Python package index '$($receipt.pythonPackageIndex)'." }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.resolvedVersion)) { throw 'SkillSpector version was not recorded.' }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.resolvedIdentity)) { throw 'SkillSpector identity was not recorded.' }
          if ($receipt.resolvedIdentity -notmatch 'metadata=skillspector@') { throw 'SkillSpector wheel METADATA identity was not recorded.' }
          if ($receipt.installDisposition -ne 'ephemeral-verification') { throw 'SkillSpector resolver install must remain verification-only.' }
          if ($receipt.resolvedIdentity -notmatch 'installDisposition=ephemeral-verification') { throw 'SkillSpector identity does not record verification-only installation.' }
          if ($receipt.interpreterIsolation -ne 'python-isolated-mode') { throw 'SkillSpector Python subprocesses were not isolated.' }
          if ($receipt.resolvedIdentity -notmatch 'interpreterIsolation=python-isolated-mode') { throw 'SkillSpector identity does not record Python interpreter isolation.' }
          if ($receipt.credentialIsolation -ne 'github-token-cleared-before-python') { throw 'SkillSpector Python subprocesses inherited GitHub credentials.' }
          if ($receipt.resolvedIdentity -notmatch 'credentialIsolation=github-token-cleared-before-python') { throw 'SkillSpector identity does not record credential isolation.' }
          if ($receipt.installedMetadataVerification -ne 'static-dist-info-metadata') { throw 'SkillSpector installed version was not verified through static metadata.' }
          if ($receipt.resolvedIdentity -notmatch 'installedMetadataVerification=static-dist-info-metadata') { throw 'SkillSpector identity does not record static installed metadata verification.' }
          if ([bool]$receipt.directReferencesAllowed) { throw 'SkillSpector direct dependency references were not blocked.' }
          if ($receipt.resolvedIdentity -notmatch 'directReferences=blocked') { throw 'SkillSpector identity does not record direct-reference blocking.' }
          if ([string]$receipt.dependencyClosureSha256 -notmatch '^[0-9a-f]{64}$') { throw 'SkillSpector dependency closure SHA-256 was not recorded.' }
          if (@($receipt.dependencyClosure).Count -le 1) { throw 'SkillSpector dependency closure did not include runtime dependencies.' }
          if ($receipt.resolvedIdentity -notmatch 'dependencyClosureSha256=[0-9a-f]{64}') { throw 'SkillSpector resolved identity does not bind the dependency closure.' }
          Write-Host "Resolved SkillSpector version: $($receipt.resolvedVersion)"
          Write-Host "Resolved SkillSpector identity: $($receipt.resolvedIdentity)"
          Write-Host "Dependency closure entries: $(@($receipt.dependencyClosure).Count)"
          Write-Host "Dependency closure SHA-256: $($receipt.dependencyClosureSha256)"

      - name: Resolve latest stable Pester from central policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:RUNNER_TEMP 'standard-validation-pester.json'
          & ./scripts/Resolve-StandardValidationTool.ps1 -ToolName pester -Install -OutputPath $receiptPath | Out-Host
          $receipt = Get-Content -Raw -Encoding UTF8 -LiteralPath $receiptPath | ConvertFrom-Json
          if ($receipt.source -ne 'PowerShellGallery:Pester') { throw "Unexpected Pester source '$($receipt.source)'." }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.resolvedVersion)) { throw 'Pester version was not recorded.' }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.resolvedIdentity)) { throw 'Pester identity was not recorded.' }
          "PESTER_RESOLVED_VERSION=$($receipt.resolvedVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PESTER_RESOLVED_IDENTITY=$($receipt.resolvedIdentity)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved Pester version: $($receipt.resolvedVersion)"
          Write-Host "Resolved Pester identity: $($receipt.resolvedIdentity)"

      - name: Run Standard v1 authority regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion $env:PESTER_RESOLVED_VERSION -Force
          Write-Host "Pester frozen for this run: $env:PESTER_RESOLVED_VERSION"
          Write-Host "Pester identity: $env:PESTER_RESOLVED_IDENTITY"
          $authorityPaths = @(
              './tests/skill-repository-standard.Tests.ps1'
              './tests/skill-repository-workflows.Tests.ps1'
              './tests/standard-validation-resolver-hardening.Tests.ps1'
          )
          $result = Invoke-Pester -Path $authorityPaths -PassThru
          Write-Host "Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Check whitespace in the event range
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff-tree --check --root -r HEAD
          fi
