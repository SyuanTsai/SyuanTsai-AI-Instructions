name: Standards Conformance

on:
  push:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'scripts/Resolve-PythonWheelClosure.py'
      - 'scripts/Invoke-StandardAuthorityGate.ps1'
      - 'scripts/Invoke-StandardValidation.ps1'
      - 'scripts/StandardSemanticBridge.psm1'
      - 'scripts/Validate-UpstreamAdapter.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - 'tests/standard-validation-runner.Tests.ps1'
      - 'tests/standard-semantic-bridge.Tests.ps1'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
      - '.github/workflows/syp101-production-smoke.yml'
      - '.github/workflows/syp86-production-lock.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/standards/**'
      - 'scripts/Resolve-StandardValidationTool.ps1'
      - 'scripts/Resolve-PythonWheelClosure.py'
      - 'scripts/Invoke-StandardAuthorityGate.ps1'
      - 'scripts/Invoke-StandardValidation.ps1'
      - 'scripts/StandardSemanticBridge.psm1'
      - 'scripts/Validate-UpstreamAdapter.ps1'
      - 'tests/skill-repository-standard.Tests.ps1'
      - 'tests/skill-repository-workflows.Tests.ps1'
      - 'tests/standard-validation-resolver-hardening.Tests.ps1'
      - 'tests/standard-validation-runner.Tests.ps1'
      - 'tests/standard-semantic-bridge.Tests.ps1'
      - '.github/workflows/standards-conformance.yml'
      - '.github/workflows/pr8-powershell-validation.yml'
      - '.github/workflows/syp101-production-smoke.yml'
      - '.github/workflows/syp86-production-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable-authority-regression:
    name: Standard v1 (latest stable tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure Pester 4.10.1 for Linux focused containment
        shell: pwsh
        run: |
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          if ($null -eq $pester) {
            Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
            $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          }
          if ($null -eq $pester) { throw 'Pester 4.10.1 is unavailable.' }

      - name: Run required Unix callback containment boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Module Pester -Force -ErrorAction SilentlyContinue
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'4.10.1' } | Select-Object -First 1
          if ($null -eq $pester) { throw 'Pester 4.10.1 is unavailable in focused test step.' }
          Import-Module $pester.Path -Force
          $result = Invoke-Pester -Script './tests/standard-semantic-bridge.Tests.ps1' -TestName 'Unix callback containment boundary' -PassThru -Show All
          if ($null -eq $result) { throw 'Pester did not return a result object for the Unix callback containment boundary.' }
          Write-Host "UnixCallbackContainment - Total: $($result.TotalCount) Passed: $($result.PassedCount) Failed: $($result.FailedCount) Skipped: $($result.SkippedCount) Pending: $($result.PendingCount) Inconclusive: $($result.InconclusiveCount)"
          if ([int64]$result.TotalCount -ne 5 -or
              [int]$result.PassedCount -ne 5 -or
              [int]$result.FailedCount -ne 0 -or
              [int]$result.SkippedCount -ne 0 -or
              [int]$result.PendingCount -ne 0 -or
              [int]$result.InconclusiveCount -ne 0) {
            throw 'Unix callback containment boundary did not produce exactly five passing tests.'
          }

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $goApplication = Get-Command -Name go -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $goCommandPath = if ($null -ne $goApplication.PSObject.Properties['Path']) { [string]$goApplication.Path } else { [string]$goApplication.Source }
          if ([string]::IsNullOrWhiteSpace($goCommandPath) -or -not [IO.Path]::IsPathRooted($goCommandPath)) { throw "setup-go returned a non-absolute Go path: $goCommandPath" }
          $versionOutput = @(& $goCommandPath version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STANDARD_GO_COMMAND_PATH=$goCommandPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 authority gate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Invoke-StandardAuthorityGate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -GoCommandPath $env:STANDARD_GO_COMMAND_PATH

      - name: Check whitespace in the event range
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff-tree --check --root -r HEAD
          fi
