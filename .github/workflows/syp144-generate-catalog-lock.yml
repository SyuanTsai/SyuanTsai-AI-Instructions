name: SYP144 Generate Catalog Lock

on:
  push:
    branches:
      - syp-144/atlassian-api-access-catalog

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate catalog lock
        shell: pwsh
        run: ./scripts/update-skills-catalog-lock.ps1

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: syp144-catalog-lock
          path: catalog/skills-catalog-lock.json
          if-no-files-found: error
