name: SYP144 Sync Contract Fixture

on:
  push:
    branches:
      - syp-144/atlassian-api-access-catalog

permissions:
  contents: write

jobs:
  sync-fixture:
    if: github.event.head_commit.message == 'SYP-144: add temporary contract fixture sync workflow'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: syp-144/atlassian-api-access-catalog
          fetch-depth: 0

      - name: Synchronize fixture contract
        shell: pwsh
        run: |
          $testPath = 'tests/skills-catalog-contract.Tests.ps1'
          $content = Get-Content -Raw -Encoding UTF8 -LiteralPath $testPath
          $old = '$result.SkillCount | Should Be 10'
          $new = '$result.SkillCount | Should Be 12'
          if (-not $content.Contains($old)) { throw "Expected stale SkillCount assertion was not found." }
          [System.IO.File]::WriteAllText((Resolve-Path $testPath), $content.Replace($old, $new), (New-Object System.Text.UTF8Encoding($false)))

          $catalogExample = 'catalog/examples/skills-catalog.example.json'
          $lockExample = 'catalog/examples/skills-catalog-lock.example.json'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $catalogExample).Hash.ToLowerInvariant()
          $lock = Get-Content -Raw -Encoding UTF8 -LiteralPath $lockExample | ConvertFrom-Json
          $lock.catalogSha256 = $hash
          $json = ConvertTo-Json -InputObject $lock -Depth 100
          [System.IO.File]::WriteAllText((Resolve-Path $lockExample), ($json + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item -LiteralPath '.github/workflows/syp144-sync-contract-example.yml'

      - name: Commit synchronized fixture
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/skills-catalog-contract.Tests.ps1 catalog/examples/skills-catalog-lock.example.json .github/workflows/syp144-sync-contract-example.yml
          git diff --cached --check
          git commit -m "SYP-144: synchronize complete catalog contract fixtures"
          git push origin HEAD:syp-144/atlassian-api-access-catalog
